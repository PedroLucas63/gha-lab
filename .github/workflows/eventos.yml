name: 02. Eventos
on: 
    workflow_dispatch:
        inputs:
            name:
                description: "Quem você quer cumprimentar?"
                required: true
                default: "turma"
                type: choice
                options:
                    - alunos
                    - turma
                    - professor
    schedule:
        - cron: "*/5 * * * *"
    push:
        paths:
            - src/**
jobs:
    cumprimentar:
        runs-on: ubuntu-latest
        steps:
            - name: Imprimir mensagem
              run: echo "Olá, ${{ inputs.name }} ($GITHUB_EVENT_NAME)"
    
