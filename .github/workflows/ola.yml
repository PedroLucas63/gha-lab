name: 01. Saudação
on: 
    push:
    workflow_dispatch:
jobs:
    saudacao:
        runs-on: ubuntu-latest
        steps:
            - name: Dizer olá
              run: |
                echo "Olá, ${{ github.actor }}! Evento: ${{ github.event_name }}"

            - name: Mostrar informações
              run: |
                echo "SO do runner: $RUNNER_SO"
                uname -a
                python3 --version
                ls -la
